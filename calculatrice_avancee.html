<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice Avancée</title>
    <style></style>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="calculator">
        <div class="display-container">
            <div class="previous-operation" id="previous-operation"></div>
            <div class="current-operation" id="current-operation">0</div>
        </div>
       
        <div class="buttons-container">
            <!-- Mémoire et fonctions spéciales -->
            <button class="button memory-btn" data-action="mc">MC</button>
            <button class="button memory-btn" data-action="mr">MR</button>
            <button class="button memory-btn" data-action="m+">M+</button>
            <button class="button memory-btn" data-action="m-">M-</button>
            <button class="button clear" data-action="clear">C</button>
           
            <!-- Fonctions scientifiques première ligne -->
            <button class="button scientific" data-action="sin">sin</button>
            <button class="button scientific" data-action="cos">cos</button>
            <button class="button scientific" data-action="tan">tan</button>
            <button class="button scientific" data-action="log">log</button>
            <button class="button operator" data-action="/">÷</button>
           
            <!-- Fonctions scientifiques deuxième ligne -->
            <button class="button scientific" data-action="sqrt">√</button>
            <button class="button scientific" data-action="power">x^y</button>
            <button class="button scientific" data-action="pi">π</button>
            <button class="button scientific" data-action="e">e</button>
            <button class="button operator" data-action="*">×</button>
           
            <!-- Chiffres et opérations de base -->
            <button class="button" data-number="7">7</button>
            <button class="button" data-number="8">8</button>
            <button class="button" data-number="9">9</button>
            <button class="button operator" data-action="-">-</button>
            <button class="button scientific" data-action="factorial">x!</button>
           
            <button class="button" data-number="4">4</button>
            <button class="button" data-number="5">5</button>
            <button class="button" data-number="6">6</button>
            <button class="button operator" data-action="+">+</button>
            <button class="button scientific" data-action="percent">%</button>
           
            <button class="button" data-number="1">1</button>
            <button class="button" data-number="2">2</button>
            <button class="button" data-number="3">3</button>
            <button class="button equals" data-action="equals" rowspan="2">=</button>
            <button class="button scientific" data-action="ln">ln</button>
           
            <button class="button zero" data-number="0">0</button>
            <button class="button" data-action="decimal">.</button>
            <button class="button" data-action="backspace">⌫</button>
            <button class="button scientific" data-action="toggle-sign">±</button>
        </div>
       
        <div class="history-container">
            <div class="history-title">Historique des calculs</div>
            <div id="history-list"></div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
